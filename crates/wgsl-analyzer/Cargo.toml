[package]
name = "wgsl-analyzer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "A language server for WGSL and WESL code"
# homepage = "https://wgsl-analyzer.github.io/"
repository.workspace = true
license.workspace = true
# documentation = "https://wgsl-analyzer.github.io/manual.html"
autobins = false

[lib]

[[bin]]
name = "wgsl-analyzer"
path = "src/bin/main.rs"

# tombi: format.rules.table-keys-order.disabled = true
[dependencies]
# ide-ssr.workspace = true
# intern.workspace = true
# This should only be used in CLI
# profile.workspace = true
base-db.workspace = true
edition.workspace = true
hir-ty.workspace = true
hir.workspace = true
ide-completion.workspace = true
ide-db.workspace = true
ide-diagnostics.workspace = true
ide.workspace = true
paths.workspace = true
stdx.workspace = true
vfs-notify.workspace = true
vfs.workspace = true
wgsl-std.workspace = true

# base64 = "0.22"
# dirs = "5.0.1"
# mimalloc = { version = "0.1.48", default-features = false, optional = true }
# process-wrap = { version = "8.2.0", features = ["std"] }
# scip = "0.5.2"
# tenthash = "1.0.0"
# threadpool = "1.8.1"
# toml = "0.8.8"
anyhow.workspace = true
camino.workspace = true
cargo_metadata.workspace = true
crossbeam-channel.workspace = true
dissimilar.workspace = true
idna_adapter.workspace = true
itertools.workspace = true
line-index.workspace = true
lsp-server.workspace = true
lsp-types = { package = "gen-lsp-types", version = "0.11.0", features = ["url"] }
percent-encoding = "2.3.2"
memchr = "2.8.1"
nohash-hasher.workspace = true
num_cpus = "1.17.0"
parking_lot = "0.12.5"
project-model.workspace = true
rustc-hash.workspace = true
salsa.workspace = true
semver.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde.workspace = true
toolchain.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
triomphe.workspace = true
xflags = "0.3.2"

[dev-dependencies]
expect-test.workspace = true
# xshell = "0.2.7"

test-utils.workspace = true
# test-fixture.workspace = true
# syntax-bridge.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = {
	version = "0.61",
	features = [
		"Win32_System_Diagnostics_Debug",
		"Win32_System_Threading",
	]
}

[features]
force-always-assert = ["stdx/force-always-assert"]
sysroot-abi = []

[lints]
workspace = true
