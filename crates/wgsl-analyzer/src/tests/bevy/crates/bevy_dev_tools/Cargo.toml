[package]
name = "bevy_dev_tools"
version = "0.20.0-dev"
edition = "2024"
description = "Collection of developer tools for the Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.20.0-dev" }
bevy_pbr = { path = "../bevy_pbr", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev" }
bevy_ui_render = { path = "../bevy_ui_render", version = "0.20.0-dev" }

# other
thiserror = { version = "2.0", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
ron = { version = "0.12", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
x264 = { version = "0.5.0", optional = true }

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_render = { path = "../bevy_render" }
bevy_pbr = { path = "../bevy_pbr" }
bevy_ui_render = { path = "../bevy_ui_render" }
bevy_core_pipeline = { path = "../bevy_core_pipeline" }
