[package]
name = "bevy_post_process"
version = "0.20.0-dev"
edition = "2024"
description = "Provides post process effects for Bevy Engine."
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
trace = []
webgl = []
webgpu = []

[dependencies]
# bevy
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev" }

smallvec = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_core_pipeline = { path = "../bevy_core_pipeline" }
bevy_pbr = { path = "../bevy_pbr" }
bevy_render = { path = "../bevy_render" }
