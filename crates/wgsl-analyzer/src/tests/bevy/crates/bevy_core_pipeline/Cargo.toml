[package]
name = "bevy_core_pipeline"
version = "0.20.0-dev"
edition = "2024"
description = "Provides a core render pipeline for Bevy Engine."
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_render = { path = "../bevy_render", version = "0.20.0-dev" }

bitflags = "2.3"
nonmax = "0.5"
indexmap = "2"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
constants = { path = "../../constants" }
bevy_render = { path = "../bevy_render" }
bevy_pbr = { path = "../bevy_pbr" }
