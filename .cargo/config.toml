[alias]
c = "clippy --all-targets --all-features -- --cap-lints warn"
codegen = "run --package xtask --bin xtask -- codegen"
dist = "run --package xtask --bin xtask -- dist"
l = "llvm-cov --lcov --output-path lcov.info"
lint = "clippy --all-targets --all-features -- --cap-lints warn"
xtask = "run --package xtask --bin xtask --"

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[target.arm-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc-8"

# The shipped rust-std for this target is built with `singlethread: true`
# (no wasm `atomics` feature), so -pthread cannot link against it. Requires
# `cargo +nightly -Z build-std=std,panic_unwind`.
[target.wasm32-unknown-emscripten]
rustflags = [
	"-Ctarget-feature=+atomics",
	"-Clink-arg=-pthread",
	# links libc++abi, which provides __cpp_exception / _Unwind_* for panic=unwind
	"-Clink-arg=-sDEFAULT_TO_CXX",
	# main() runs on a pthread so we need this to avoid deadlocks when a thread is spawned.
	"-Clink-arg=-sPROXY_TO_PTHREAD=1",
	"-Clink-arg=-sPTHREAD_POOL_SIZE=8",
	"-Clink-arg=-sPTHREAD_POOL_SIZE_STRICT=0",
	# matches DEFAULT_STACK_SIZE in crates/stdx/src/thread.rs
	"-Clink-arg=-sSTACK_SIZE=16MB",  # MB is actually MiB
	"-Clink-arg=-sINITIAL_MEMORY=512MB",
	"-Clink-arg=-sMAXIMUM_MEMORY=4GB",
	"-Clink-arg=-sALLOW_MEMORY_GROWTH=1",
	"-Clink-arg=-sEXIT_RUNTIME=1",
	"-Clink-arg=-sWASM_BIGINT=1",
	# Without this main() would run on load.
	"-Clink-arg=-sMODULARIZE=1",
	"-Clink-arg=-sEXPORT_ES6=1",
	"-Clink-arg=-sEXPORT_NAME=createWgslAnalyzer",
	# WasmFS is wasm-side and multithreaded, so it is preferred over the legacy JS filesystem.
	"-Clink-arg=-sWASMFS=1",
	# WasmFS only emits the JS filesystem API it can prove it needs, and seeding
	# the workspace calls it directly. Without this, Module.FS arrives missing
	# mkdir/writeFile/unlink and boot fails.
	"-Clink-arg=-sFORCE_FILESYSTEM=1",
	# Seed the filesystem before main() runs, then callMain([]).
	"-Clink-arg=-sINVOKE_RUN=0",
	"-Clink-arg=-sEXPORTED_RUNTIME_METHODS=FS,callMain",
]

# The web extension's server. The memory is imported, and
# editors/code/src/web/main.ts must create it with the same values.
[target.wasm32-wasip1-threads]
rustflags = [
	"-Clink-arg=--initial-memory=536870912",  # 512 MiB, 8192 pages
	"-Clink-arg=--max-memory=4294967296",  # 4 GiB, 65536 pages
]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
