<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>wgsl-analyzer in CodeMirror</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				display: grid;
				grid-template-rows: auto 1fr auto;
				height: 100vh;
				background: #1e1e1e;
				color: #d4d4d4;
			}
			header {
				padding: 0.75rem 1rem;
				border-bottom: 1px solid #333;
			}
			h1 {
				font-size: 1rem;
				margin: 0 0 0.25rem;
			}
			#status {
				font-size: 0.8rem;
				color: #9cdcfe;
			}
			#editor {
				min-height: 0;
			}
			#log {
				margin: 0;
				padding: 0.5rem 1rem;
				max-height: 8rem;
				overflow: auto;
				border-top: 1px solid #333;
				font-size: 0.75rem;
				white-space: pre-wrap;
				color: #808080;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>wgsl-analyzer in CodeMirror</h1>
			<div id="status">Loading…</div>
		</header>
		<div id="editor"></div>
		<pre id="log"></pre>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
