name: Release
on:
  schedule:
    - cron: 0 0 * * * # midnight UTC

  workflow_dispatch:

  push:
    branches:
      - release

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: "10"
  FETCH_DEPTH: "0" # pull in the tags for the version string
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  dist:
    if: ${{ github.repository == 'wgsl-analyzer/wgsl-analyzer' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
            allocator: mimalloc

          - os: windows-latest
            target: i686-pc-windows-msvc
            allocator: mimalloc

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
            allocator: mimalloc

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # Use a container with glibc 2.28
            # Zig is not used because it does not work with PGO
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:c1eab7504661beb3b1381336a2d7a5b86d91f9b6486e6b1b653f53fdb183ce2f
            code-target: linux-x64
            allocator: system

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:79ef9ac575740a16d374c036e150a2817f2d5e7dd09f3aef91707055f4b929c9
            code-target: linux-arm64
            allocator: system

          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            # Use a Debian 10 (EOL) container for glibc 2.28
            # pypa/manylinux only has armv7l and glibc 2.31
            container: debian:10
            code-target: linux-armhf
            allocator: system

          - os: macos-14
            target: x86_64-apple-darwin
            code-target: darwin-x64
            allocator: system

          - os: macos-14
            target: aarch64-apple-darwin
            code-target: darwin-arm64
            allocator: system

    name: dist (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    env:
      WA_TARGET: ${{ matrix.target }}
      ALLOCATOR_FLAG: ${{ matrix.allocator != 'system' && format('--{0}', matrix.allocator) || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      - name: Install target dependencies
        if: ${{ matrix.target == 'arm-unknown-linux-gnueabihf' }}
        run: |
          sed -i -e 's/deb.debian.org/archive.debian.org/g' -e 's/security.debian.org/archive.debian.org/g' -e '/buster-updates/d' /etc/apt/sources.list
          apt-get update
          apt-get dist-upgrade -y
          apt-get install -y curl gcc gcc-8-arm-linux-gnueabihf

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ./editors/code/package.json
          cache: ''
          cache-dependency-path: ''
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate
        working-directory: ./editors/code

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: ${{ matrix.pgo && 'llvm-tools' || '' }}
          target: ${{ matrix.target }}

      - name: Dist
        run: cargo xtask dist --client-patch-version ${{ github.run_number }} ${{ env.ALLOCATOR_FLAG }} # ${{ matrix.pgo && format('--pgo {0}', matrix.pgo) || ''}}

      - run: pnpm install --frozen-lockfile
        working-directory: editors/code

      - name: Package Extension (release)
        if: github.ref == 'refs/heads/release' && matrix.code-target
        run: pnpm run package -o "../../dist/wgsl-analyzer-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }}
        working-directory: editors/code

      - name: Package Extension (nightly)
        if: github.ref != 'refs/heads/release' && matrix.code-target
        run: pnpm run package -o "../../dist/wgsl-analyzer-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }} --pre-release
        working-directory: editors/code

      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: rm -rf editors/code/server

      - if: matrix.target == 'x86_64-unknown-linux-gnu' && github.ref == 'refs/heads/release'
        run: pnpm run package -o ../../dist/wgsl-analyzer-no-server.vsix
        working-directory: editors/code

      - if: matrix.target == 'x86_64-unknown-linux-gnu' && github.ref != 'refs/heads/release'
        run: pnpm run package -o ../../dist/wgsl-analyzer-no-server.vsix --pre-release
        working-directory: editors/code

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: ./dist

  dist-x86_64-unknown-linux-musl:
    if: ${{ github.repository == 'wgsl-analyzer/wgsl-analyzer' || github.event_name == 'workflow_dispatch' }}
    name: dist (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    env:
      WA_TARGET: x86_64-unknown-linux-musl
      # For some reason `-crt-static` is not working for clang without lld
      RUSTFLAGS: -C link-arg=-fuse-ld=lld -C target-feature=-crt-static
    container:
      image: rust:alpine
      volumes:
        - /usr/local/cargo/registry:/usr/local/cargo/registry

    steps:
      - name: Install dependencies
        run: apk add --no-cache git clang lld musl-dev nodejs pnpm

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      - name: Dist
        run: cargo xtask dist --client-patch-version ${{ github.run_number }}

      - run: pnpm install --frozen-lockfile
        working-directory: editors/code

      - name: Package Extension (release)
        if: github.ref == 'refs/heads/release'
        run: pnpm run package -o "../../dist/wgsl-analyzer-alpine-x64.vsix" --target alpine-x64 --no-dependencies
        working-directory: editors/code

      - name: Package Extension (nightly)
        if: github.ref != 'refs/heads/release'
        run: pnpm run package -o "../../dist/wgsl-analyzer-alpine-x64.vsix" --target alpine-x64 --pre-release --no-dependencies
        working-directory: editors/code

      - run: rm -rf editors/code/server

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-x86_64-unknown-linux-musl
          path: ./dist

  dist-dprint-plugin:
    if: ${{ github.repository == 'wgsl-analyzer/wgsl-analyzer' || github.event_name == 'workflow_dispatch' }}
    name: dist (dprint-plugin-wgslfmt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Build dprint plugin
        run: |
          cargo build --release -p dprint-plugin-wgslfmt --target wasm32-unknown-unknown
          mkdir -p dist
          # dprint plugins have to be named `plugin.wasm`.
          cp target/wasm32-unknown-unknown/release/dprint_plugin_wgslfmt.wasm dist/plugin.wasm
          cp crates/wgslfmt_dprint/deployment/dprint_plugin_wgslfmt_schema.json dist/dprint_plugin_wgslfmt_schema.json

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-dprint-plugin
          path: ./dist

  publish:
    if: ${{ github.repository == 'wgsl-analyzer/wgsl-analyzer' || github.event_name == 'workflow_dispatch' }}
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: ["dist", "dist-x86_64-unknown-linux-musl", "dist-dprint-plugin"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ./editors/code/package.json
          cache: ''
          cache-dependency-path: ''
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate
        working-directory: ./editors/code

      - name: Set release tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/release" ]; then
            git fetch --tags
            today=$(date --iso -u)
            last_tag=$(git tag -l "${today}*" | sort -V | tail -n1)
            if [ -n "$last_tag" ]; then
              last_v=$(echo "$last_tag" | grep -oP '(?<=\.)\d+' || echo 0)
              new_v=$(($last_v + 1))
              tag="${today}.${new_v}"
            else
              tag="$today"
            fi
            echo "TAG=$tag" >> $GITHUB_ENV
          else
            echo "TAG=nightly" >> $GITHUB_ENV
          fi

      - name: Set HEAD_SHA
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "HEAD_SHA: $HEAD_SHA"

      - name: Download dist-aarch64-apple-darwin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-apple-darwin
          path: dist

      - name: Download dist-x86_64-unknown-linux-gnu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist

      - name: Download dist-x86_64-unknown-linux-musl artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist

      - name: Download dist-aarch64-unknown-linux-gnu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist

      - name: Download dist-arm-unknown-linux-gnueabihf artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist

      - name: Download dist-x86_64-pc-windows-msvc artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist

      - name: Download dist-i686-pc-windows-msvc artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-i686-pc-windows-msvc
          path: dist

      - name: Download dist-aarch64-pc-windows-msvc artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist

      - name: Download dist-dprint-plugin artifact
        if: false # the formatter is not ready yet, so skip downloading it for now
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-dprint-plugin
          path: dist

      - run: ls -al ./dist

      - name: Publish Release
        uses: $/.github/actions/github-release
        with:
          files: dist/*
          name: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile
        working-directory: ./editors/code

      - name: Publish Extension (Code Marketplace, release)
        if: github.ref == 'refs/heads/release' && github.repository == 'wgsl-analyzer/wgsl-analyzer'
        working-directory: ./editors/code
        # token from https://dev.azure.com/wgsl-analyzer/
        run: pnpm exec vsce publish --pat ${{ secrets.VSCE_PAT }} --packagePath ../../dist/wgsl-analyzer-*.vsix --no-dependencies

      - name: Publish Extension (OpenVSX, release)
        if: github.ref == 'refs/heads/release' && github.repository == 'wgsl-analyzer/wgsl-analyzer'
        working-directory: ./editors/code
        run: pnpm exec ovsx publish --pat ${{ secrets.OVSX_PAT }} --packagePath ../../dist/wgsl-analyzer-*.vsix --no-dependencies
        timeout-minutes: 2

      - name: Publish Extension (Code Marketplace, nightly)
        if: github.ref != 'refs/heads/release' && github.repository == 'wgsl-analyzer/wgsl-analyzer'
        working-directory: ./editors/code
        run: pnpm exec vsce publish --pat ${{ secrets.VSCE_PAT }} --packagePath ../../dist/wgsl-analyzer-*.vsix --pre-release --no-dependencies

      - name: Publish Extension (OpenVSX, nightly)
        if: github.ref != 'refs/heads/release' && github.repository == 'wgsl-analyzer/wgsl-analyzer'
        working-directory: ./editors/code
        run: pnpm exec ovsx publish --pat ${{ secrets.OVSX_PAT }} --packagePath ../../dist/wgsl-analyzer-*.vsix --no-dependencies
        timeout-minutes: 2

  notify-failure:
    name: notify failure
    runs-on: ubuntu-latest
    needs: ["dist", "dist-x86_64-unknown-linux-musl", "dist-dprint-plugin", "publish"]
    permissions:
      issues: write
    if: |
      always() &&
      contains(needs.*.result, 'failure') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    steps:
      - name: Create or update failure issue
        run: |
          previous_issue_number=$(gh issue list \
            --search "$TITLE in:title" \
            --json number \
            --jq '.[0].number')
          if [[ -n $previous_issue_number ]]; then
            gh issue comment "$previous_issue_number" \
              --body "Release workflow still failing: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create \
              --title "$TITLE" \
              --label "$LABELS" \
              --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Release workflow failed on `${{ github.ref_name }}`
          LABELS: "C-Bug,S-Needs-Triage"
          BODY: |
            ## Release workflow failed

            [The offending run.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Branch:** `${{ github.ref_name }}`
            **Triggered by:** `${{ github.event_name }}`
