# Please make sure that the `needs` field for the `conclusion` job
# are updated when adding new jobs!

name: Continuous integration

on:
  pull_request:
  merge_group:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CI: 1
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: -D warnings
  # If nightly is breaking CI, modify this variable to target a specific nightly version.
  NIGHTLY_TOOLCHAIN: nightly
  # Pinned so an emsdk release cannot change what the emscripten job links.
  EMSDK_VERSION: 6.0.6

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      javascript: ${{ steps.filter.outputs.javascript }}
      emscripten: ${{ steps.filter.outputs.emscripten }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO: Get rid of this unmaintained action
      - name: Filter by paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            typescript:
              - 'editors/code/**'
            javascript:
              - 'js/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            # Subdirectories rather than 'js/wgsl-analyzer-web/**', so a README
            # or biome-config edit does not trigger a full emscripten build.
            emscripten:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/config.toml'
              - 'js/wgsl-analyzer-web/scripts/**'
              - 'js/wgsl-analyzer-web/src/**'
              - 'js/wgsl-analyzer-web/tests/**'
              - 'js/examples/**'

  no-ai-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect slop
        uses: Jondolf/ai-commit-check@7069d4254c6310cdb0395a6ab0ca1f29af897f83 # v1.0.1

  rust:
    name: Rust
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # key won't match, will rely on restore-keys
          key: ${{ runner.os }}-stable-${{ hashFiles('**/Cargo.toml') }}-
          # See .github/workflows/update-caches.yaml for how keys are generated
          restore-keys: |
            ${{ runner.os }}-stable-${{ hashFiles('**/Cargo.toml') }}-
            ${{ runner.os }}-stable-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy

      # https://github.com/actions-rust-lang/setup-rust-toolchain/blob/main/rust.json
      - name: Install Rust Problem Matcher
        if: matrix.os == 'ubuntu-latest'
        run: echo "::add-matcher::.github/rust.json"

      # - name: Cache Dependencies
      #   uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
      #   with:
      #     workspaces: |
      #       . -> target
      #       ./crates/proc-macro-srv/proc-macro-test/imp -> target

      - name: Install nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest

      # TODO: See https://github.com/wgsl-analyzer/wgsl-analyzer/issues/359
      # - name: Codegen checks (wgsl-analyzer)
      #   if: matrix.os == 'ubuntu-latest'
      #   run: cargo codegen --check

      - name: Test
        run: cargo nextest run --no-fail-fast --hide-progress-bar --status-level fail

      - name: Clippy
        # Because Linux runners are the fastest
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rustfmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  miri:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # key won't match, will rely on restore-keys
          key: ${{ runner.os }}-${{ env.NIGHTLY_TOOLCHAIN }}--${{ hashFiles('**/Cargo.toml') }}-
          # See .github/workflows/update-caches.yml for how keys are generated
          restore-keys: |
            ${{ runner.os }}-${{ env.NIGHTLY_TOOLCHAIN }}--${{ hashFiles('**/Cargo.toml') }}-
            ${{ runner.os }}-${{ env.NIGHTLY_TOOLCHAIN }}--
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
          components: miri

      # TODO: See https://github.com/wgsl-analyzer/wgsl-analyzer/issues/361
      # - name: Run Miri
      #   run: cargo miri test

  # Check wgslfmt_dprint builds for wasm32 target
  wgslfmt-dprint-wasm:
    name: Check wgslfmt_dprint WASM build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Check wgslfmt_dprint for wasm32
        run: cargo check -p dprint-plugin-wgslfmt --target wasm32-unknown-unknown

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint.jsonc
          globs: "**/*.md"

  toml:
    name: Check TOML formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tombi
        uses: tombi-toml/setup-tombi@603c3e90bc4382f3dd5c44573484db1c664102dd # v1.4.1

      - name: Lint TOML files
        run: tombi lint

      - name: Check formatting of TOML files
        run: tombi format --check --diff

      - name: Tombi info
        if: failure()
        run: |
          echo 'To fix toml formatting, please run `tombi format`.'
          echo 'To check for a diff, run `tombi format --check --diff`.'
          echo 'You can find tombi here: https://tombi-toml.github.io/tombi/.'
          echo 'Also use the `Tombi` extension.'
          echo 'You can find the extension here: https://marketplace.visualstudio.com/items?itemName=tombi-toml.tombi'

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for typos
        uses: crate-ci/typos@a8168dc2984a9e2352f183ffe788f0f23a300389 # v1.49.1

      - name: Typos info
        if: failure()
        run: |
          echo 'To fix typos, please run `typos -w`'
          echo 'To check for a diff, run `typos`'
          echo 'You can find typos here: https://crates.io/crates/typos'
          echo 'if you use VS Code, you can also install `Typos Spell Checker'
          echo 'You can find the extension here: https://marketplace.visualstudio.com/items?itemName=tekumara.typos-vscode'

  rustdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items --keep-going
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: -C debuginfo=0 -D warnings

      - name: Documentation tests
        run: cargo test --workspace --doc
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: -C debuginfo=0 -D warnings

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0

      - name: Install cargo-deadlinks
        run: cargo binstall --no-confirm cargo-deadlinks

      - name: Checks dead links
        run: cargo deadlinks --dir target/doc
        continue-on-error: true

  check-unused-dependencies:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0

      - name: Install cargo-shear
        run: cargo binstall --no-confirm cargo-shear

      - name: Run cargo-shear
        run: cargo shear

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    name: TypeScript
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ./editors/code/package.json

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate
        working-directory: ./editors/code

      - name: Set up pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('editors/code/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install xvfb
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y xvfb

      - name: Build
        run: pnpm install --frozen-lockfile
        working-directory: ./editors/code

      #    - run: pnpm audit || { sleep 10 && pnpm audit; } || { sleep 30 && pnpm audit; }
      #      if: runner.os == 'Linux'
      #      working-directory: ./editors/code

      # If this steps fails, your code's type integrity might be wrong at some places at TypeScript level.
      - name: Typecheck
        run: pnpm run typecheck
        working-directory: ./editors/code

      - name: Run biome checks
        run: pnpm run ci
        working-directory: ./editors/code

      - name: Run VS Code tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          VSCODE_CLI: 1
        run: xvfb-run pnpm test
        working-directory: ./editors/code

      - name: Run VS Code tests (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VSCODE_CLI: 1
        run: pnpm test
        working-directory: ./editors/code

      - name: Package
        run: pnpm run package
        working-directory: ./editors/code

  # Everything in `js/` that does not need a toolchain. `build:lib`,
  # `build:worker`, biome and the unit tests all work without the wasm ever
  # existing: `src/wgsl_analyzer.d.ts` is what lets `worker.ts` typecheck
  # against glue that only appears in `dist/` after `build:wasm`.
  javascript:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ./package.json

      # Resolves the root `packageManager` field, so this must not run in
      # ./editors/code the way the `typescript` job does.
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Set up pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-root-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-root-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `ci` is biome plus `tsc --noEmit`.
      - name: Run biome checks and typecheck
        run: pnpm --filter wgsl-analyzer-web run ci

      - name: Build
        run: pnpm --filter wgsl-analyzer-web run build

      - name: Check the build produced what consumers import
        run: |
          for artifact in index.js index.d.ts worker.js; do
            if [[ ! -f "js/wgsl-analyzer-web/dist/${artifact}" ]]; then
              echo "::error::dist/${artifact} is missing after a successful build"
              exit 1
            fi
          done

      - name: Unit tests
        run: pnpm --filter wgsl-analyzer-web run test

      # Both examples import all three public entry points, so these fail if the
      # `exports` map or the declaration emit breaks. They need `build` above,
      # but not the wasm.
      - name: Typecheck the monaco example
        run: pnpm --filter wgsl-analyzer-monaco-example run typecheck

      - name: Typecheck the codemirror example
        run: pnpm --filter wgsl-analyzer-codemirror-example run typecheck

  # Links the LSP server for wasm32-unknown-emscripten and runs it. A debug
  # build is used here because it skips `lto = "fat"`, `opt-level = "z"` and
  # `codegen-units = 1`; the release configuration that actually ships is
  # covered by emscripten-release.yaml.
  emscripten:
    needs: changes
    if: needs.changes.outputs.emscripten == 'true'
    name: Emscripten
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-src, because the shipped rust-std for this target is built without
      # the wasm `atomics` feature and so cannot link with -pthread. See the
      # comment in .cargo/config.toml.
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: rust-src
          target: wasm32-unknown-emscripten

      - name: Install the emscripten SDK
        uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      # A self-contained cache: ci.yaml's shared restore-keys are
      # `${{ runner.os }}-stable-`, while update-caches.yaml saves under
      # `${{ runner.os }}-<hash>-<hash>`, so those never match and this job
      # cannot rely on them. The wasm target directory is disjoint from the
      # host-target one anyway.
      - name: Cache the emscripten build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/wasm32-unknown-emscripten/
          key: emscripten-${{ runner.os }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: emscripten-${{ runner.os }}-

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ./package.json

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Set up pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-root-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-root-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the wasm module
        run: pnpm --filter wgsl-analyzer-web run build:wasm:debug

      - name: Build the package
        run: pnpm --filter wgsl-analyzer-web run build

      # The glue must be named wgsl_analyzer.js: it spawns its pthread pool with
      # `new Worker(new URL("wgsl_analyzer.js", import.meta.url))`, so cargo's
      # bin-name artifact would 404 every pthread.
      - name: Check the staged artifacts
        run: |
          for artifact in index.js index.d.ts worker.js wgsl_analyzer.js wgsl_analyzer.wasm; do
            if [[ ! -f "js/wgsl-analyzer-web/dist/${artifact}" ]]; then
              echo "::error::dist/${artifact} is missing after build:wasm + build"
              exit 1
            fi
          done

      - name: Boot the module and round trip LSP
        run: pnpm --filter wgsl-analyzer-web run test:smoke

      # `prebuild` runs copy-assets.mjs, which exits 1 unless all three staged
      # files are present under those exact names, then vite bundles for real.
      - name: Build the monaco example
        run: pnpm --filter wgsl-analyzer-monaco-example run build

      - name: Build the codemirror example
        run: pnpm --filter wgsl-analyzer-codemirror-example run build

  conclusion:
    needs:
      [
        no-ai-commits,
        rust,
        # rust-cross,
        markdown,
        rustfmt,
        miri,
        toml,
        typos,
        rustdoc,
        check-unused-dependencies,
        typescript,
        javascript,
        emscripten,
        wgslfmt-dprint-wasm,
      ]
    # We need to ensure this job does *not* get skipped if its dependencies fail,
    # because a skipped job is considered a success by GitHub. So we have to
    # overwrite `if:`. We use `!cancelled()` to ensure the job does still not get run
    # when the workflow is canceled manually.
    #
    # ALL THE PREVIOUS JOBS NEED TO BE ADDED TO THE `needs` SECTION OF THIS JOB!
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Manually check the status of all dependencies. `if: failure()` does not work.
      - name: Conclusion
        run: |
          # Print the dependent jobs to see them in the CI log
          jq -C <<< "${NEEDS}"
          # Check if all jobs that we depend on (in the needs array) were successful (or have been skipped).
          jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "${NEEDS}"
        env:
          NEEDS: ${{ toJSON(needs) }}

  cancel-if-matrix-failed:
    needs: rust
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel parallel jobs
        run: |
          if jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "${NEEDS}"; then
            exit 0
          fi
          # https://docs.github.com/en/rest/actions/workflow-runs?apiVersion=2022-11-28#cancel-a-workflow-run
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel
        env:
          NEEDS: ${{ toJSON(needs) }}
