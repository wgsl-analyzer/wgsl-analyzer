# Verifies the emscripten configuration that actually ships.
#
# The `emscripten` job in ci.yaml builds with the debug profile so it can run on
# every pull request. That skips `lto = "fat"`, `opt-level = "z"` and
# `codegen-units = 1`, and leaves emscripten's assertions on. Release adds
# Binaryen meta-DCE and wasm import/export minification, which is exactly what
# the export assertions in the smoke test exist to catch, so it needs its own
# run.

name: Emscripten release build

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: {}

# Environment variables must be kept in sync with all workflows that defines them.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CI: 1
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  # If nightly is breaking CI, modify this variable to target a specific nightly version.
  NIGHTLY_TOOLCHAIN: nightly
  # Pinned so an emsdk release cannot change what this job links.
  EMSDK_VERSION: 6.0.6

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-src, because the shipped rust-std for this target is built without
      # the wasm `atomics` feature and so cannot link with -pthread.
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: rust-src
          target: wasm32-unknown-emscripten

      - name: Install the emscripten SDK
        uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ./package.json

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No cargo cache: this runs weekly on main, where a cold, faithful build is
      # the point. `lto = "fat"` with `codegen-units = 1` dominates the runtime.
      - name: Build the wasm module
        run: pnpm --filter wgsl-analyzer-web run build:wasm

      - name: Build the package
        run: pnpm --filter wgsl-analyzer-web run build

      - name: Report the payload size
        run: |
          cd js/wgsl-analyzer-web/dist
          for artifact in wgsl_analyzer.wasm wgsl_analyzer.js worker.js; do
            raw=$(stat -c%s "${artifact}")
            gzip=$(gzip -9 -c "${artifact}" | wc -c)
            printf '%-20s raw %9s  gzip %9s\n' "${artifact}" "${raw}" "${gzip}"
          done | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Boot the module and round trip LSP
        run: pnpm --filter wgsl-analyzer-web run test:smoke

      - name: Build the monaco example
        run: pnpm --filter wgsl-analyzer-monaco-example run build

      - name: Build the codemirror example
        run: pnpm --filter wgsl-analyzer-codemirror-example run build

      - name: Upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wgsl-analyzer-web-dist
          path: js/wgsl-analyzer-web/dist
          retention-days: 14

  open-issue:
    name: Warn that the emscripten release build fails
    runs-on: ubuntu-latest
    needs: build
    permissions:
      issues: write
    # Use always() so the job does not get canceled if any other jobs fail
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - name: Create issue
        run: |
          previous_issue_number=$(gh issue list \
            --search "$TITLE in:title" \
            --json number \
            --jq '.[0].number')
          if [[ -n $previous_issue_number ]]; then
            gh issue comment $previous_issue_number \
              --body "Emscripten release build still fails: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create \
              --title "$TITLE" \
              --label "$LABELS" \
              --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: The emscripten release build fails on main.
          LABELS: C-Bug,S-Needs-Triage
          BODY: |
            ## The weekly emscripten release build has failed.
            [The offending run.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            This builds `js/wgsl-analyzer-web` with the release profile and boots
            the result under Node. The per-PR `emscripten` job in `ci.yaml` uses
            a debug build, so a failure here that does not reproduce there points
            at `-Oz`, `lto = "fat"`, or Binaryen meta-DCE dropping an export.
