[workspace]
resolver = "2"
members = [
	# "lib/*",
	"crates/*",
	"xtask/",
]
exclude = []

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/wgsl-analyzer/wgsl-analyzer"
license = "MIT OR Apache-2.0"

# tombi: format.rules.table-keys-order.disabled = true
[workspace.dependencies]
# local crates
base-db = { path = "./crates/base_db", version = "0.0.0" }
hir = { path = "./crates/hir", version = "0.0.0" }
hir-def = { path = "./crates/hir_def", version = "0.0.0" }
hir-ty = { path = "./crates/hir_ty", version = "0.0.0" }
ide = { path = "./crates/ide", version = "0.0.0" }
ide-completion = { path = "./crates/ide_completion", version = "0.0.0" }
ide-diagnostics = { path = "./crates/ide-diagnostics", version = "0.0.0" }
ide-db = { path = "./crates/ide-db", version = "0.0.0" }
parser = { path = "./crates/parser", version = "0.0.0" }
profile = { path = "./crates/profile", version = "0.0.0" }
project-model = { path = "./crates/project-model", version = "0.0.0" }
syntax = { path = "./crates/syntax", version = "0.0.0" }
toolchain = { path = "./crates/toolchain", version = "0.0.0" }
test-fixture = { path = "./crates/test-fixture", version = "0.0.0" }
test-utils = { path = "./crates/test-utils", version = "0.0.0" }
vfs = { path = "./crates/vfs", version = "0.0.0" }
vfs-notify = { path = "./crates/vfs-notify", version = "0.0.0" }
wgsl-formatter = { path = "./crates/wgsl-formatter", version = "0.0.0", features = ["serde"] }
wgsl-std = { path = "./crates/wgsl-std", version = "0.0.0" }
edition = { path = "./crates/edition", version = "0.0.0" }
stdx = { path = "./crates/stdx", version = "0.0.0" }
paths = { path = "./crates/paths", version = "0.0.0", features = ["serde1"] }
#
# crates from rust-analyzer that are published separately
line-index = { version = "0.1.2", default-features = false }
la-arena = { version = "0.3.1", default-features = false }
lsp-server = { version = "0.10.0", default-features = false }
#
# non-local crates
anyhow = { version = "1.0.104", default-features = false }
camino = { version = "1.2.6", default-features = false }
criterion = { version = "0.8.2", default-features = false }
crossbeam-utils = { version = "0.8.23", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["error-context", "help", "std", "usage"] }
# cov-mark = { version = "2.0.0", default-features = false }
crossbeam-channel = { version = "0.5.17", default-features = false }
dashmap = { version = "6.2.1", default-features = false }
dissimilar = { version = "1.0.11", default-features = false }
dot = { version = "0.2.0", default-features = false }
dprint-core = { version = "0.71.1", default-features = false, features = ["tracing", "wasm"] }
dprint-core-macros = { version = "0.1.0", default-features = false }
either = { version = "1.19.0", default-features = false }
expect-test = { version = "1.5.1", default-features = false }
flate2 = { version = "1.1.10", default-features = false }
glob = { version = "0.3.4", default-features = false }
indexmap = { version = "2.14.2", default-features = false }
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
jemallocator = { package = "tikv-jemallocator", version = "0.7.0" }
jod-thread = { version = "1.0.0", default-features = false }
lelwel = { version = "0.10.4", default-features = false }
libc = { version = "0.2.191", default-features = false }
logos = { version = "0.16.1", default-features = false, features = ["export_derive"] }
lsp-types = { package = "gen-lsp-types", version = "0.11.0", features = ["url"] }
memchr = { version = "2.8.3", default-features = false }
miow = { version = "0.6.1", default-features = false }
nohash-hasher = { version = "0.2.0", default-features = false }
num_cpus = { version = "1.17.0", default-features = false }
parking_lot = { version = "0.12.5", default-features = false }
percent-encoding = { version = "2.3.2", default-features = false }
rayon = { version = "1.12.0", default-features = false }
rowan = { version = "0.17.0", default-features = false }
rustc-hash = { version = "2.1.3", default-features = false }
# Ideally we'd not enable the macros feature but unfortunately the `tracked` attribute does not work
# on impls without it
salsa = { version = "0.28.5", default-features = false, features = ["inventory", "macros", "rayon", "salsa_unstable", "triomphe"] }
salsa-macros = { version = "0.28.5", default-features = false }
semver = { version = "1.0.28", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
smallvec = { version = "1.16.3", default-features = false, features = ["const_generics", "const_new", "union"] }
smol_str = { version = "0.3.6", default-features = false }
text-size = { version = "1.1.1", default-features = false }
time = { version = "0.3.55", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "local-time", "registry", "std", "time", "tracing-log"] }
tracing-tree = { version = "0.4.1", default-features = false }
triomphe = { version = "0.1.17", default-features = false, features = ["std"] }
unicode-ident = { version = "1.0.27", default-features = false }
walkdir = { version = "2.5.0", default-features = false }
# wesl_metadata = { version = "0.0.1", default-features = false }
wgsl-types = { version = "0.6.0", default-features = false, features = ["naga-ext"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
write-json = { version = "0.1.4", default-features = false }
xflags = { version = "0.3.2", default-features = false }
xshell = { version = "0.2.7", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate", "time"] }

# idna_adapter does not use semantic versioning
# 1.0 is a feature band that indicates no IDNA support
idna_adapter = "~1.0.0"

# tombi: format.rules.table-keys-order.disabled = true
[workspace.lints.clippy]
cargo = { level = "warn", priority = -2 }
complexity = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -2 }
restriction = { level = "warn", priority = -2 }
style = { level = "warn", priority = -2 }
suspicious = { level = "warn", priority = -2 }
# wgsl-analyzer has no stability commitment
exhaustive_structs = "allow"
# wgsl-analyzer has no stability commitment
exhaustive_enums = "allow"
# good for organization
single_call_fn = "allow"
# unidiomatic
implicit_return = "allow"
# unidiomatic
question_mark_used = "allow"
# often useful
shadow_reuse = "allow"
# often useful
pub_use = "allow"
# no no_std support
std_instead_of_alloc = "allow"
# no no_std support
std_instead_of_core = "allow"
# not important
cargo_common_metadata = "allow"
# not under this crate's control
multiple_crate_versions = "allow"
# makes it easier to keep up to date with new lints
blanket_clippy_restriction_lints = "allow"
# style preference
pub_with_shorthand = "allow"
# often hurts readability
absolute_paths = "allow"
# incorrect
items_after_statements = "allow"
# do not care
shadow_unrelated = "allow"
# antipattern
missing_trait_methods = "allow"
# is fine
float_arithmetic = "allow"
# style preference
separated_literal_suffix = "allow"
# style preference
self_named_module_files = "allow"
# style preference
semicolon_outside_block = "allow"
# conflicting with redundant_else
else_if_without_else = "allow"
# does not allow test module to be at bottom of file
arbitrary_source_item_ordering = "allow"
# unwanted restriction
field_scoped_visibility_modifiers = "allow"
# unwanted restriction
redundant_pub_crate = "allow"
# needs to be determined on a case-by-case basis
default_numeric_fallback = "allow"
# nursery, ugly suggestions
option_if_let_else = "allow"
# not a good general rule for the cost it entails
arithmetic_side_effects = "allow"
# always covered by min_ident_chars
many_single_char_names = "allow"
# poor general recommendation/style
unneeded_field_pattern = "allow"
# this is not a cryptographic context
integer_division_remainder_used = "allow"
# expect-test has a special integration with raw string
needless_raw_strings = "allow"
needless_raw_string_hashes = "allow"
# not useful
shadow_same = "allow"
# do not care
inline_modules = "allow"
# TODOs
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
unwrap_used = "allow"
unwrap_in_result = "allow"
pattern_type_mismatch = "allow"
panic_in_result_fn = "allow"
panic = "allow"
missing_errors_doc = "allow"
missing_assert_message = "allow"
cast_precision_loss = "allow"
multiple_inherent_impl = "allow"
iter_over_hash_type = "allow"
expect_used = "allow"
string_slice = "allow"
# is this helpful enough?
missing_inline_in_public_items = "allow"
# prefer get().expect() so that the reason is documented
indexing_slicing = "allow"

# tombi: format.rules.table-keys-order.disabled = true
[workspace.lints.rust]
warnings = { level = "warn", priority = -2 }
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
missing_crate_level_docs = "warn"
# missing_doc_code_examples = "warn"
private_doc_tests = "warn"
private_intra_doc_links = "allow"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[workspace.metadata.cargo-shear]
# this transitive dependency is pinned because it does not use semantic versioning
ignored = ["idna_adapter"]

[profile.dev]
debug = 1

[profile.dev.package]
# These speed up local tests.
rowan.opt-level = 3
rustc-hash.opt-level = 3
salsa.opt-level = 3
serde.opt-level = 3
smol_str.opt-level = 3
text-size.opt-level = 3
# This speeds up `cargo xtask dist`.
# miniz_oxide.opt-level = 3

[profile.release]
# Set this to 1 or 2 to get more useful backtraces in debugger.
debug = 0
incremental = true

[profile.dev-rel]
inherits = "release"
debug = 2
